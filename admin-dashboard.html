<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Sistema de Gestión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
</head>
<body>

<aside class="sidebar">
    <div class="brand-box">
        <h4 class="fw-bold m-0"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
        <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
    </div>

    <nav>
        <a href="admin-dashboard.html" class="nav-link-custom active">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="admin-productos.html" class="nav-link-custom">
            <i class="bi bi-box-seam"></i> Inventario
        </a>
        <a href="admin-pedidos.html" class="nav-link-custom d-flex align-items-center justify-content-between">
            <div><i class="bi bi-truck me-2"></i> Pedidos</div>
            <span class="badge bg-danger rounded-pill badge-pedidos-nav d-none shadow-sm" style="font-size: 0.75rem;">0</span>
        </a>
        <a href="admin-categorias.html" class="nav-link-custom">
            <i class="bi bi-tags"></i> Categorías
        </a>
        
        <a href="admin-clientes.html" class="nav-link-custom">
            <i class="bi bi-people"></i> Clientes
        </a>
        <a href="admin-descuentos.html" class="nav-link-custom">
            <i class="bi bi-percent"></i> Descuentos
        </a>
        
        <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
            <a href="productos.html" class="nav-link-custom">
                <i class="bi bi-shop"></i> Ir a la Tienda
            </a>
        <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h3 class="fw-bold m-0 text-dark">Resumen de Negocio</h3>
            <p class="text-muted m-0" id="liveDate"></p>
        </div>
        <div class="d-flex align-items-center bg-white p-2 rounded-pill shadow-sm border">
            <img src="https://ui-avatars.com/api/?name=Ernesto+Tejada&background=0D6EFD&color=fff" class="rounded-circle me-2" width="35">
            <span class="fw-bold small me-3 text-dark">Ernesto Tejada</span>
        </div>
    </header>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card card-neo card-today p-4">
                <div class="d-flex align-items-center">
                    <div class="icon-box me-3">
                        <i class="bi bi-cash-stack"></i>
                    </div>
                    <div>
                        <p class="metric-title mb-0">Ingresos Hoy</p>
                        <h2 class="metric-value mb-0" id="statIngresosHoy">$0.00</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-neo card-week p-4">
                <div class="d-flex align-items-center">
                    <div class="icon-box me-3">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                    <div>
                        <p class="metric-title mb-0">Esta Semana</p>
                        <h2 class="metric-value mb-0" id="statIngresosSemana">$0.00</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-neo card-month p-4">
                <div class="d-flex align-items-center">
                    <div class="icon-box me-3">
                        <i class="bi bi-calendar-month"></i>
                    </div>
                    <div>
                        <p class="metric-title mb-0">Este Mes</p>
                        <h2 class="metric-value mb-0" id="statIngresosMes">$0.00</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card card-neo p-4 h-100">
                <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Tendencia de Ventas</h5>
                <div style="height: 350px;">
                    <canvas id="graficaVentas"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card card-neo p-4 h-100">
                <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-pie-chart-fill me-2 text-success"></i>Stock por Categoría</h5>
                <div style="height: 300px; display: flex; justify-content: center;">
                    <canvas id="graficaCategorias"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script>
<script>
    // Configurar fecha en español 
    document.getElementById('liveDate').innerText = new Date().toLocaleDateString('es-ES', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
    });
</script>
</body>
</html>
