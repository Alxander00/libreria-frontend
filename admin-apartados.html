<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Apartados</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    <!-- SIDEBAR (copia el mismo de admin-listas.html y agrega el enlace) -->
     <admin-sidebar current="apartados"></admin-sidebar>

    <main class="main-content">
        <h2 class="fw-bold"><i class="bi bi-lock text-primary me-2"></i>Gestión de Apartados</h2>
        <p class="text-muted">Administra los apartados de los clientes. Puedes liquidar o cancelar.</p>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Total</th>
                            <th>Pagado</th>
                            <th>Saldo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaApartadosBody">
                        <tr><td colspan="8" class="text-center py-5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-apartados.js"></script>
</body>
</html>
