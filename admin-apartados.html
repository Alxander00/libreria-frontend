<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Apartados | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    
    <!-- Sidebar -->
    <admin-sidebar current="apartados"></admin-sidebar>

    <main class="main-content">
        
        <!-- Banner Superior Administrativo Mágico -->
        <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
            <i class="bi bi-safe position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
            
            <div class="position-relative z-1">
                <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                    <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-lock-fill me-1"></i> SISTEMA DE RESERVAS</span>
                </div>
                <h3 class="fw-bolder m-0 display-6">
                    Gestión de Apartados
                </h3>
                <p class="text-white-50 small m-0 mt-1">
                    Administra los productos reservados. Registra abonos, liquida o cancela apartados.
                </p>
            </div>
            
            <!-- Buscador Integrado en el Banner -->
            <div class="position-relative z-1">
                <div class="input-group shadow-lg rounded-pill overflow-hidden bg-white p-1" style="min-width: 300px; border: 2px solid transparent; transition: all 0.3s;" onfocusin="this.style.borderColor='#0d6efd'; this.style.boxShadow='0 0 0 4px rgba(13, 110, 253, 0.15)'" onfocusout="this.style.borderColor='transparent'; this.style.boxShadow='var(--bs-box-shadow-lg)'">
                    <span class="input-group-text bg-white border-0 text-primary ps-3"><i class="bi bi-search"></i></span>
                    <input type="text" id="busquedaApartado" class="form-control border-0 bg-white shadow-none fw-bold text-dark" placeholder="Buscar por cliente o folio..." onkeyup="renderizarApartados()">
                </div>
            </div>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="card card-neo border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="table-responsive">
                <table class="table align-middle m-0 border-0 text-nowrap">
                    <thead class="bg-light text-muted small text-uppercase" style="letter-spacing: 1px;">
                        <tr>
                            <th class="ps-4 border-0 py-3 rounded-start-4">Folio</th>
                            <th class="border-0 py-3">Cliente</th>
                            <th class="border-0 py-3">Producto Reservado</th>
                            <th class="border-0 py-3 text-center">Progreso de Pago</th>
                            <th class="border-0 py-3 text-center">Estado</th>
                            <th class="pe-4 border-0 py-3 text-end rounded-end-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaApartadosBody" class="border-top-0">
                        <tr><td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                            <p class="text-muted mt-2 mb-0">Cargando apartados...</p>
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-apartados.js"></script>
</body>
</html>
