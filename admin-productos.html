<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Pro | Gestión de Inventario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
</head>
<body class="bg-light">

<aside class="sidebar shadow-sm">
    <div class="brand-box mb-4 text-center border-bottom pb-3">
        <h4 class="fw-bold m-0 text-dark"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
        <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
    </div>
    <nav>
        <a href="admin-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="admin-productos.html" class="nav-link-custom active shadow-sm"><i class="bi bi-box-seam me-2"></i> Inventario</a>
        <a href="admin-pedidos.html" class="nav-link-custom d-flex align-items-center justify-content-between">
            <div><i class="bi bi-truck me-2"></i> Pedidos</div>
            <span class="badge bg-danger rounded-pill badge-pedidos-nav d-none shadow-sm" style="font-size: 0.75rem;">0</span>
        </a>
        <a href="admin-categorias.html" class="nav-link-custom"><i class="bi bi-tags me-2"></i> Categorías</a>
        <a href="admin-clientes.html" class="nav-link-custom"><i class="bi bi-people me-2"></i> Clientes</a>
        <a href="admin-descuentos.html" class="nav-link-custom"><i class="bi bi-percent me-2"></i> Descuentos</a>
        
        <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
            <a href="productos.html" class="nav-link-custom"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <div class="row align-items-center mb-4 g-3">
        <div class="col-md-3">
            <h2 class="fw-bold text-dark m-0"><i class="bi bi-box-seam me-2 text-primary"></i> Inventario</h2>
            <p class="text-muted m-0 small">Gestiona tus productos.</p>
        </div>
        
        <div class="col-md-4">
            <div class="input-group shadow-sm rounded-pill overflow-hidden border bg-white">
                <span class="input-group-text bg-white border-0 text-primary ps-3"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInputAdmin" class="form-control border-0 shadow-none bg-white" placeholder="Buscar por nombre...">
            </div>
        </div>

        <div class="col-md-3">
            <select id="categoriaFiltroAdmin" class="form-select shadow-sm rounded-pill border-0 text-secondary">
                <option value="">Todas las categorías</option>
                </select>
        </div>

        <div class="col-md-2 text-md-end">
            <a href="crear-producto.html" class="btn btn-primary fw-bold shadow-sm rounded-pill w-100">
                <i class="bi bi-plus-lg me-1"></i> Nuevo
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-muted small">
                        <tr>
                            <th class="px-4 py-3">IMAGEN</th>
                            <th class="py-3">NOMBRE DEL PRODUCTO</th>
                            <th class="py-3">CATEGORÍA</th>
                            <th class="py-3">PRECIO</th>
                            <th class="py-3">STOCK TOTAL</th>
                            <th class="px-4 py-3 text-end">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosBody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border text-primary" role="status"></div>
                                <div class="mt-2">Cargando inventario...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script> <script src="js/admin-productos.js"></script>
</body>
</html>
