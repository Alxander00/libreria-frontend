<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <!-- Sidebar -->
    <admin-sidebar current="productos"></admin-sidebar>

    <main class="main-content">
        
        <!-- Banner Superior Administrativo Mágico -->
        <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
            <i class="bi bi-boxes position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
            
            <div class="position-relative z-1">
                <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                    <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-box-seam-fill me-1"></i> CATÁLOGO CENTRAL</span>
                </div>
                <h3 class="fw-bolder m-0 display-6">
                    Inventario de Tienda
                </h3>
                <p class="text-white-50 small m-0 mt-1">
                    Administra tus productos, controla el stock y ajusta precios y categorías.
                </p>
            </div>
            
            <div class="position-relative z-1">
                <a href="crear-producto.html" class="btn btn-light text-primary fw-bold shadow border-0 rounded-pill px-4 py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle-fill fs-5"></i> Nuevo Producto
                </a>
            </div>
        </div>

        <!-- Panel de Filtros y Búsqueda -->
        <div class="card card-neo border-0 shadow-sm rounded-4 p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group bg-light rounded-pill overflow-hidden border p-1" style="transition: all 0.3s;" onfocusin="this.style.borderColor='#0d6efd'; this.style.boxShadow='0 0 0 4px rgba(13, 110, 253, 0.15)'" onfocusout="this.style.borderColor='var(--bs-border-color)'; this.style.boxShadow='none'">
                        <span class="input-group-text bg-transparent border-0 text-primary ps-3"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInputAdmin" class="form-control bg-transparent border-0 shadow-none fw-bold text-dark" placeholder="Buscar por nombre o descripción...">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group bg-light rounded-pill overflow-hidden border p-1">
                        <span class="input-group-text bg-transparent border-0 text-secondary ps-3"><i class="bi bi-tags-fill"></i></span>
                        <select id="categoriaFiltroAdmin" class="form-select bg-transparent border-0 shadow-none fw-bold text-dark cursor-pointer">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="card card-neo border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="table-responsive">
                <table class="table align-middle m-0 border-0">
                    <thead class="bg-light text-muted small text-uppercase" style="letter-spacing: 1px;">
                        <tr>
                            <th class="ps-4 border-0 py-3 rounded-start-4" style="width: 80px;">Foto</th>
                            <th class="border-0 py-3">Detalle del Producto</th>
                            <th class="border-0 py-3">Categoría</th>
                            <th class="border-0 py-3">Precio Base</th>
                            <th class="border-0 py-3">Disponibilidad</th>
                            <th class="pe-4 border-0 py-3 text-end rounded-end-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosBody" class="border-top-0">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border text-primary mb-2" role="status"></div>
                                <div>Sincronizando catálogo...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-productos.js"></script>
</body>
</html>
