<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Pro | Centro de Operaciones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
</head>
<body class="bg-light">
    
<aside class="sidebar shadow-sm">
    <div class="brand-box mb-4 text-center border-bottom pb-3">
        <h4 class="fw-bold m-0 text-dark"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
        <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
    </div>
    <nav>
        <a href="admin-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="admin-productos.html" class="nav-link-custom"><i class="bi bi-box-seam me-2"></i> Inventario</a>
        <a href="admin-pedidos.html" class="nav-link-custom active shadow-sm d-flex align-items-center justify-content-between">
            <div><i class="bi bi-truck me-2"></i> Pedidos</div>
            <span class="badge bg-danger rounded-pill badge-pedidos-nav d-none shadow-sm" style="font-size: 0.75rem;">0</span>
        </a>
        <a href="admin-categorias.html" class="nav-link-custom"><i class="bi bi-tags me-2"></i> Categorías</a>
        <a href="admin-clientes.html" class="nav-link-custom"><i class="bi bi-people me-2"></i> Clientes</a>
        <a href="admin-descuentos.html" class="nav-link-custom"><i class="bi bi-percent me-2"></i> Descuentos</a>
        
        <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
            <a href="productos.html" class="nav-link-custom"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <div class="row mb-3 align-items-center">
        <div class="col-lg-6 mb-3 mb-lg-0">
            <h2 class="fw-bold text-dark m-0"><i class="bi bi-ui-checks-grid me-2 text-primary"></i> Centro de Operaciones</h2>
        </div>
        <div class="col-lg-6">
            <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="busquedaCliente" class="form-control border-0 bg-white shadow-none" placeholder="Buscar cliente en esta sección..." onkeyup="renderizarAdminActual()">
            </div>
        </div>
    </div>

    <ul class="nav nav-tabs mb-4 border-bottom" id="adminTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active text-primary fw-bold border-0 border-bottom border-primary border-3 bg-transparent px-4 py-3 d-flex align-items-center" onclick="cambiarTabAdmin('NUEVOS', this)">
                📦 Nuevos <span class="badge bg-danger rounded-pill ms-2" id="countNuevos" style="display: none;">0</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link text-muted border-0 bg-transparent px-4 py-3 d-flex align-items-center" onclick="cambiarTabAdmin('TRANSITO', this)">
                🚚 En Tránsito <span class="badge bg-primary rounded-pill ms-2" id="countTransito" style="display: none;">0</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link text-muted border-0 bg-transparent px-4 py-3" onclick="cambiarTabAdmin('ARCHIVO', this)">
                🗄️ Archivo
            </button>
        </li>
    </ul>
    
    <div class="text-end mb-3">
        <button class="btn btn-sm btn-outline-danger fw-bold shadow-sm bg-white" onclick="limpiarBaseDeDatosTest()" id="btnLimpiarBD" style="display: none;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Borrar Tests de DB
        </button>
    </div>

    <div class="row g-4" id="adminPedidosContainer"></div>
</main>

<div class="modal fade" id="modalDetalles" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header bg-dark text-white border-0 py-3">
                <div class="d-flex align-items-center">
                    <div class="icon-shape bg-primary bg-opacity-10 text-primary me-3" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px;">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold mb-0">Orden de Entrega #<span id="modalPedidoId"></span></h5>
                        <small class="text-white-50">Verifica los productos antes de despachar</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 bg-light">
                <div id="listaProductosDetalle" class="d-flex flex-column gap-3"></div>
                <div class="mt-4 p-4 bg-white rounded-4 shadow-sm border text-end">
                    <p class="text-muted small mb-1">TOTAL A COBRAR / ENTREGAR</p>
                    <h2 class="fw-bold text-success m-0" id="modalTotal">$0.00</h2>
                </div>
            </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cerrar Lista</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script> <script src="js/admin-pedidos.js"></script>
</body>
</html>
