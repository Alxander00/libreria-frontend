<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Operaciones | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Estilos Globales y Específicos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
    <link rel="stylesheet" href="css/admin-pedidos.css">
    
    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    
    <!-- Sidebar -->
    <admin-sidebar current="pedidos"></admin-sidebar>

    <main class="main-content">
        
        <!-- Banner Superior Administrativo Mágico -->
        <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
            <i class="bi bi-box-seam position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
            
            <div class="position-relative z-1">
                <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                    <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-truck me-1"></i> LOGÍSTICA</span>
                </div>
                <h3 class="fw-bolder m-0 display-6">
                    Centro de Operaciones
                </h3>
                <p class="text-white-50 small m-0 mt-1">
                    Gestiona los pedidos, envíos y despachos en tienda de tus clientes.
                </p>
            </div>
            
            <!-- Buscador Integrado en el Banner -->
            <div class="position-relative z-1">
                <div class="input-group shadow-lg rounded-pill overflow-hidden bg-white search-pedidos-container p-1" style="min-width: 300px;">
                    <span class="input-group-text bg-white border-0 text-primary ps-3"><i class="bi bi-search"></i></span>
                    <input type="text" id="busquedaCliente" class="form-control border-0 bg-white shadow-none fw-bold text-dark" placeholder="Buscar cliente..." onkeyup="renderizarAdminActual()">
                </div>
            </div>
        </div>

        <!-- Pestañas de Navegación (Estilo Píldoras) -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="tabs-wrapper shadow-sm">
                <button class="btn tab-admin active px-4 py-2" onclick="cambiarTabAdmin('NUEVOS', this)">
                    📦 Nuevos <span class="badge bg-danger rounded-pill ms-2" id="countNuevos" style="display: none;">0</span>
                </button>
                <button class="btn tab-admin text-muted px-4 py-2" onclick="cambiarTabAdmin('TRANSITO', this)">
                    🚚 En Tránsito <span class="badge bg-primary rounded-pill ms-2" id="countTransito" style="display: none;">0</span>
                </button>
                <button class="btn tab-admin text-muted px-4 py-2" onclick="cambiarTabAdmin('ARCHIVO', this)">
                    🗄️ Archivo
                </button>
            </div>
            
            <button class="btn btn-sm btn-outline-danger fw-bold shadow-sm rounded-pill px-3" onclick="limpiarBaseDeDatosTest()" id="btnLimpiarBD" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Borrar Tests
            </button>
        </div>

        <!-- Contenedor de Tarjetas de Pedidos -->
        <div class="row g-4" id="adminPedidosContainer"></div>
    </main>

    <!-- Modal Mágico de Detalles -->
    <div class="modal fade" id="modalDetalles" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
                <div class="modal-header bg-dark text-white border-0 p-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape bg-primary bg-opacity-25 text-white me-3 border border-primary border-opacity-50">
                            <i class="bi bi-box-seam fs-4"></i>
                        </div>
                        <div>
                            <h4 class="modal-title fw-bold mb-0">Orden #<span id="modalPedidoId"></span></h4>
                            <small class="text-white-50">Verifica los productos antes de despachar</small>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div id="listaProductosDetalle" class="d-flex flex-column gap-3 mb-4"></div>
                    
                    <div class="p-4 bg-white rounded-4 shadow-sm border border-success border-opacity-25 text-end d-flex justify-content-between align-items-center">
                        <span class="text-secondary fw-bold text-uppercase" style="letter-spacing: 1px;">TOTAL A COBRAR</span>
                        <h2 class="fw-bolder text-success m-0 display-6" id="modalTotal">$0.00</h2>
                    </div>
                </div>
                <div class="modal-footer border-0 bg-light p-4 pt-0">
                    <button type="button" class="btn btn-secondary rounded-pill px-5 py-2 fw-bold w-100 shadow-sm" data-bs-dismiss="modal">Cerrar Lista</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-pedidos.js"></script>
</body>
</html>
