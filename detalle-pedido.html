<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Compra | Mi Tienda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4" href="productos.html">
                <i class="bi bi-bag-check-fill text-primary"></i> MI TIENDA
            </a>
            <div class="collapse navbar-collapse" id="navbarContenido">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <a href="mis-pedidos.html" class="text-decoration-none text-muted mb-3 d-inline-block fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Volver a mis compras
        </a>
        
        <div class="row g-4 mt-1">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 h-100">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Resumen del Pedido</h5>
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                            <span class="text-muted">N° de Orden</span>
                            <span class="fw-bold text-dark" id="pedidoId">#00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                            <span class="text-muted">Fecha</span>
                            <span class="fw-semibold text-dark text-end" id="pedidoFecha">--</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4 border-bottom pb-2">
                            <span class="text-muted">Estado</span>
                            <span id="pedidoEstado" class="badge rounded-pill">--</span>
                        </div>
                        
                        <div class="bg-light p-3 rounded-4 mb-4 border">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted small">Subtotal Bruto</span>
                                <span class="fw-semibold text-dark small" id="pedidoSubtotal">$0.00</span>
                            </div>

                            <div id="filaAhorro" class="d-flex justify-content-between mb-2 d-none">
                                <span class="text-success small fw-bold">Descuento Aplicado</span>
                                <span class="fw-bold text-success small" id="pedidoAhorro">-$0.00</span>
                            </div>
                            
                            <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                                <span class="text-muted small">Costo de Envío</span>
                                <span class="fw-semibold text-primary small" id="pedidoEnvio">+$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="fw-bold text-secondary">Total Pagado</span>
                                <span class="fw-bold fs-3 text-primary" id="pedidoTotal">$0.00</span>
                            </div>
                        </div>

                        <div class="border rounded-4 p-3 bg-white border-primary-subtle shadow-sm">
                            <h6 class="fw-bold text-dark mb-2"><i class="bi bi-truck text-primary me-2"></i>Entrega</h6>
                            <div class="small mb-2">
                                <span id="pedidoMetodo" class="fw-semibold text-dark">--</span>
                            </div>
                            <div class="small">
                                <span id="pedidoDireccion" class="fw-semibold text-muted">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Artículos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Producto</th>
                                        <th>Precio Unit.</th>
                                        <th class="text-center">Cant.</th>
                                        <th class="pe-4 text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="detalleBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/detalle-pedido.js"></script>
</body>
</html>
