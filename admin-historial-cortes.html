<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Cortes</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    <!-- SIDEBAR -->
     <admin-sidebar current="cortes"></admin-sidebar>

    <main class="main-content">
        <h2 class="fw-bold"><i class="bi bi-clock-history text-primary me-2"></i>Historial de Cortes de Caja</h2>
        <p class="text-muted">Consulta todos los cortes realizados. Filtra por rango de fechas.</p>

        <!-- Filtros -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label fw-bold">Desde</label>
                <input type="datetime-local" id="filtroInicio" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Hasta</label>
                <input type="datetime-local" id="filtroFin" class="form-control">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary w-100 fw-bold shadow-sm" onclick="cargarHistorial()">
                    <i class="bi bi-search me-2"></i> Filtrar
                </button>
            </div>
        </div>

        <!-- Tabla de historial -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Apertura</th>
                            <th>Cierre</th>
                            <th>Efectivo</th>
                            <th>Tarjeta</th>
                            <th>Transferencia</th>
                            <th>Total</th>
                            <th>Efectivo Físico</th>
                            <th>Diferencia</th>
                            <th>Cerrado por</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorialBody">
                        <tr><td colspan="10" class="text-center py-5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-historial-cortes.js"></script>
</body>
</html>
