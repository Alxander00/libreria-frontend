<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito | MI TIENDA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4" href="productos.html">
                <i class="bi bi-bag-check-fill text-primary"></i> MI TIENDA
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContenido">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item d-none" id="navMisPedidos"><a class="nav-link" href="mis-pedidos.html"><i class="bi bi-box-seam me-1"></i> Mis Compras</a></li>
                </ul>
                
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="carrito.html" class="btn btn-outline-light position-relative border-0 shadow-none">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
                    </a>

                    <div class="dropdown">
                        <button class="btn btn-primary btn-sm dropdown-toggle shadow-none" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> Cuenta
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li id="itemAdmin" class="d-none"><a class="dropdown-item fw-bold text-primary" href="admin-dashboard.html"><i class="bi bi-shield-lock me-2"></i> Administrar</a></li>
                            <li><a class="dropdown-item" href="mis-pedidos.html"><i class="bi bi-box-seam me-2"></i> Mis Compras</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger fw-bold" id="btnSalir"><i class="bi bi-box-arrow-right me-2"></i> Salir</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-cart3 text-primary me-2"></i>Tu Carrito</h4>
                    <div id="carrito-items">
                        </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
                    <h5 class="fw-bold mb-3"><i class="bi bi-truck text-primary me-2"></i>Método de Entrega</h5>
                    
                    <div class="form-check p-3 border rounded-3 mb-2" style="cursor: pointer;">
                        <input class="form-check-input" type="radio" name="metodoEntrega" id="radioRetiro" value="RETIRO" checked onchange="actualizarInterfazEntrega()">
                        <label class="form-check-label d-flex justify-content-between w-100" for="radioRetiro">
                            <span><i class="bi bi-shop me-2"></i>Retiro en Tienda</span>
                            <span class="text-success fw-bold">Gratis</span>
                        </label>
                    </div>

                    <div class="form-check p-3 border rounded-3 mb-3" style="cursor: pointer;">
                        <input class="form-check-input" type="radio" name="metodoEntrega" id="radioEnvio" value="ENVIO" onchange="actualizarInterfazEntrega()">
                        <label class="form-check-label d-flex justify-content-between w-100" for="radioEnvio">
                            <span><i class="bi bi-truck me-2"></i>Envío a Domicilio</span>
                            <span class="text-primary fw-bold">+$5.00</span>
                        </label>
                    </div>

                    <div id="seccionDireccion" class="d-none">
                        <label class="form-label small fw-bold text-muted">Dirección de Envío (Todo El Salvador)</label>
                        <textarea id="direccionEnvio" class="form-control mb-2" rows="2" placeholder="Ej: Res. Libertad, Polígono X, Casa #2, Santa Tecla..."></textarea>
                    </div>
                    
                    <div id="seccionRetiro" class="alert alert-info py-2 px-3 small mb-0">
                        <i class="bi bi-info-circle me-1"></i> Puedes retirar tu pedido en nuestra sucursal de El Tunco, La Libertad.
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3">Resumen</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="resumen-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Costo de entrega</span>
                        <span id="resumen-envio">$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total</span>
                        <span id="resumen-total" class="fw-bold fs-5 text-primary">$0.00</span>
                    </div>
                    <button class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm" onclick="procesarPedido()">
                        FINALIZAR PEDIDO <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js"></script>
<script src="js/carrito.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
