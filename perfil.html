<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | MI LIBRERÍA</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Estilos Separados -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">

    <!-- 1. ORDEN CRUCIAL: API primero, luego Componentes -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100 pb-5 pb-lg-0">

    <!-- Navbar Reutilizable Inteligente -->
    <mi-navbar></mi-navbar>

    <!-- Banner Superior Mágico -->
    <div class="cover-banner w-100 overflow-hidden position-relative">
        <!-- Íconos flotantes decorativos con toque mágico -->
        <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 5rem; top: 15%; right: 10%;"></i>
        <i class="bi bi-bookmark-heart-fill position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -20px; left: 5%;"></i>
        <i class="bi bi-magic position-absolute text-warning opacity-25 flotante-3 d-none d-md-block" style="font-size: 4rem; top: 30%; right: 40%;"></i>
    </div>

    <!-- Contenedor Principal del Perfil -->
    <main class="container profile-container flex-grow-1">
        <div class="row g-4 justify-content-center">
            
            <!-- Columna Izquierda: Tarjeta de Avatar y Menú de Cuenta -->
            <div class="col-lg-4 col-xl-3">
                <div class="card card-neo-profile text-center mb-4">
                    <div class="card-body px-4 pb-4">
                        
                        <div class="avatar-upload-box position-relative overflow-hidden group mx-auto">
                            <img id="profileAvatarImg" src="" 
                                 class="rounded-circle w-100 h-100 object-fit-cover shadow-inner">
                            
                            <div class="avatar-edit-overlay d-flex align-items-center justify-content-center position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 text-white rounded-circle opacity-0 transition-all cursor-pointer" 
                                 style="cursor: pointer;" onclick="document.getElementById('avatarInput').click()">
                                <i class="bi bi-camera-fill fs-2"></i>
                            </div>
                        </div>
                        
                        <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/jpg" class="d-none" onchange="subirAvatar(this)">
                        
                        <p class="text-muted small mt-2 mb-0">Toca la foto para cambiarla</p>
                        <h4 class="fw-bold text-dark mt-3 mb-1 text-truncate" id="lblNombreLateral">Cargando...</h4>
                        <p class="text-muted small mb-0 text-truncate" id="lblEmailLateral">usuario@ejemplo.com</p>
                    </div>
                </div>

                <!-- Menú Lateral Estilo Dashboard -->
                <div class="card card-neo-profile p-3 d-none d-lg-block">
                    <div class="nav flex-column nav-pills nav-pills-custom" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active" id="v-pills-general-tab" data-bs-toggle="pill" data-bs-target="#v-pills-general" type="button" role="tab">
                            <i class="bi bi-person-lines-fill"></i> Datos Generales
                        </button>
                        <button class="nav-link" id="v-pills-seguridad-tab" data-bs-toggle="pill" data-bs-target="#v-pills-seguridad" type="button" role="tab">
                            <i class="bi bi-shield-lock-fill"></i> Seguridad
                        </button>
                        <a href="mis-pedidos.html" class="nav-link text-decoration-none text-dark">
                            <i class="bi bi-box-seam-fill"></i> Mis Compras
                        </a>
                        <a href="mis-listas.html" class="nav-link text-decoration-none text-dark">
                            <i class="bi bi-card-checklist"></i> Mis Listas
                        </a>
                        <a href="mis-apartados.html" class="nav-link text-decoration-none text-dark">
                            <i class="bi bi-clock-history"></i> Mis Apartados
                        </a>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Formularios de Edición -->
            <div class="col-lg-8 col-xl-9">
                <div class="card card-neo-profile h-100">
                    <div class="card-body p-4 p-lg-5">
                        
                        <!-- Pestañas Móviles de Navegación Rápida -->
                        <ul class="nav nav-tabs d-lg-none mb-4 gap-2 border-0" id="mobileProfileTabs" role="tablist">
                            <li class="nav-item flex-fill" role="presentation">
                                <button class="nav-link active w-100 rounded-pill fw-bold text-center py-2" id="mob-general-tab" data-bs-toggle="pill" data-bs-target="#v-pills-general" type="button" role="tab">Datos</button>
                            </li>
                            <li class="nav-item flex-fill" role="presentation">
                                <button class="nav-link w-100 rounded-pill fw-bold text-center py-2" id="mob-seguridad-tab" data-bs-toggle="pill" data-bs-target="#v-pills-seguridad" type="button" role="tab">Seguridad</button>
                            </li>
                        </ul>

                        <form id="formPerfil" onsubmit="event.preventDefault(); actualizarPerfil();">
                            
                            <div class="tab-content" id="v-pills-tabContent">
                                
                                <!-- Sección General -->
                                <div class="tab-pane fade show active" id="v-pills-general" role="tabpanel">
                                    <h4 class="fw-bold text-dark mb-4">Información de la Cuenta</h4>
                                    
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary small fw-bold">Nombre Completo</label>
                                            <input type="text" id="perfilNombre" class="form-control input-neo-profile" placeholder="Ej: Ernesto Tejada" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary small fw-bold">Correo Electrónico</label>
                                            <input type="email" id="perfilEmail" class="form-control input-neo-profile text-muted" disabled>
                                        </div>
                                        
                                        <div class="col-12 mt-4">
                                            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">Datos Logísticos</h5>
                                        </div>
                                        
                                        <div class="col-md-12">
                                            <label class="form-label text-secondary small fw-bold">Número de Teléfono / WhatsApp</label>
                                            <div class="input-group">
                                                <span class="input-group-text border-2 border-end-0 bg-white text-success rounded-start-3"><i class="bi bi-whatsapp"></i></span>
                                                <input type="text" id="perfilTelefono" class="form-control input-neo-profile border-start-0 ps-0 rounded-start-0" placeholder="Ej: 77778888" maxlength="8" required>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label text-secondary small fw-bold">Dirección de Envío Predeterminada</label>
                                            <textarea id="perfilDireccion" class="form-control input-neo-profile" rows="4" placeholder="Residencial, Block, Casa, Municipio..."></textarea>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-5 text-end pt-3">
                                        <button type="submit" class="btn btn-primary fw-bold px-5 py-2 rounded-pill shadow-sm btn-guardar-global w-100 w-md-auto">
                                            <i class="bi bi-save2-fill me-2"></i> Guardar Cambios
                                        </button>
                                    </div>
                                </div>

                                <!-- Sección Seguridad -->
                                <div class="tab-pane fade" id="v-pills-seguridad" role="tabpanel">
                                    <h4 class="fw-bold text-dark mb-4">Gestión de Contraseña</h4>
                                    
                                    <div class="alert alert-primary bg-primary bg-opacity-10 border-0 rounded-4 mb-4 d-flex align-items-center p-3">
                                        <i class="bi bi-info-circle-fill fs-3 text-primary me-3 flex-shrink-0"></i>
                                        <span class="text-primary-emphasis small fw-medium">Solo llena estos campos si deseas actualizar tu contraseña actual. Si no, déjalos en blanco.</span>
                                    </div>

                                    <div class="row g-4">
                                        <div class="col-md-12">
                                            <label class="form-label text-secondary small fw-bold">Nueva Contraseña</label>
                                            <div class="input-group">
                                                <input type="password" id="perfilPassword" class="form-control input-neo-profile border-end-0 rounded-end-0" placeholder="Escribe tu nueva clave">
                                                <button class="btn btn-outline-secondary border-2 border-start-0 bg-white rounded-end-3 px-3" type="button" onclick="togglePasswordVisibility('perfilPassword', this)">
                                                    <i class="bi bi-eye text-muted"></i>
                                                </button>
                                            </div>
                                            <div class="password-meter">
                                                <div id="meterFill" class="password-meter-fill bg-danger"></div>
                                            </div>
                                            <small id="meterText" class="text-muted" style="font-size: 0.75rem;">Mínimo 6 caracteres recomendados.</small>
                                        </div>

                                        <div class="col-md-12">
                                            <label class="form-label text-secondary small fw-bold">Confirmar Nueva Contraseña</label>
                                            <div class="input-group">
                                                <input type="password" id="perfilConfirmPassword" class="form-control input-neo-profile border-end-0 rounded-end-0" placeholder="Repite la clave exacta">
                                                <button class="btn btn-outline-secondary border-2 border-start-0 bg-white rounded-end-3 px-3" type="button" onclick="togglePasswordVisibility('perfilConfirmPassword', this)">
                                                    <i class="bi bi-eye text-muted"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mt-5 text-end pt-3">
                                        <button type="submit" class="btn btn-primary fw-bold px-5 py-2 rounded-pill shadow-sm btn-guardar-global w-100 w-md-auto">
                                            <i class="bi bi-shield-lock-fill me-2"></i> Actualizar Seguridad
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </form>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Navegación móvil inferior y Footer Globales -->
    <mi-bottom-nav current="cuenta"></mi-bottom-nav>
    <mi-footer></mi-footer>

    <!-- 2. SCRIPTS FINALES: Bootstrap primero, luego la lógica del perfil -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
