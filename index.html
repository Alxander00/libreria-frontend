<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MI LIBRERÍA</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center position-relative overflow-hidden">

    <!-- Elementos Decorativos Mágicos de Fondo -->
    <i class="bi bi-stars position-absolute text-primary opacity-25 flotante-1" style="font-size: 5rem; top: 10%; left: 10%;"></i>
    <i class="bi bi-book-half position-absolute text-warning opacity-20 flotante-2" style="font-size: 6rem; bottom: 5%; right: 10%;"></i>
    <i class="bi bi-magic position-absolute text-info opacity-25 flotante-3 d-none d-md-block" style="font-size: 4rem; top: 20%; right: 15%;"></i>

    <div class="container d-flex justify-content-center align-items-center py-5">
        <div class="w-100" style="max-width: 420px;">
            
            <!-- Tarjeta Principal con Estilo Mágico -->
            <div class="card auth-card bg-white p-4 p-lg-5 shadow-lg position-relative">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 shadow-inner" style="width: 70px; height: 70px;">
                        <i class="bi bi-book-half fs-2"></i>
                    </div>
                    <h3 class="fw-bolder text-dark m-0">¡Bienvenido!</h3>
                    <p class="text-secondary small mt-1">Ingresa a tu cuenta para continuar tu magia</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="tu@correo.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end mb-4">
                        <a href="#" class="text-primary text-decoration-none small fw-bold" onclick="recuperarPassword()">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">
                        Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>
                
                <hr class="text-muted opacity-25 my-4">

                <p class="text-center mb-0 text-secondary small">
                    ¿No tienes una cuenta? <a href="register.html" class="text-primary fw-bold text-decoration-none">Regístrate aquí</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
