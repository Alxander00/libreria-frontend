<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TECH-STORE</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container justify-content-center">
        <div class="auth-card bg-white" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary"><i class="bi bi-cpu-fill"></i> TECH-STORE</h2>
                <p class="text-muted">Ingresa a tu cuenta para continuar</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div class="text-center mt-3">
                    <a href="#" class="text-secondary text-decoration-none small fw-bold" onclick="recuperarPassword()">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
            </form>
            
            <p class="text-center mb-0 text-muted">
                ¿No tienes cuenta? <a href="register.html" class="text-primary fw-bold text-decoration-none">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
