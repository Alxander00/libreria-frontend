<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | MI LIBRERÍA</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center position-relative overflow-hidden py-4">

    <!-- Elementos Decorativos Mágicos de Fondo -->
    <i class="bi bi-stars position-absolute text-primary opacity-25 flotante-1" style="font-size: 5rem; top: 5%; left: 8%;"></i>
    <i class="bi bi-bookmark-heart-fill position-absolute text-warning opacity-20 flotante-2" style="font-size: 6rem; bottom: 5%; right: 8%;"></i>
    <i class="bi bi-magic position-absolute text-info opacity-25 flotante-3 d-none d-md-block" style="font-size: 4rem; top: 15%; right: 12%;"></i>

    <div class="container d-flex justify-content-center align-items-center">
        <div class="w-100" style="max-width: 520px;">
            
            <!-- Tarjeta Principal con Estilo Mágico -->
            <div class="card auth-card bg-white p-4 p-lg-5 shadow-lg position-relative">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 shadow-inner" style="width: 70px; height: 70px;">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bolder text-dark m-0">Crear una Cuenta</h3>
                    <p class="text-secondary small mt-1">Únete a nuestra comunidad para realizar tus compras mágicas</p>
                </div>

                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3"><i class="bi bi-person"></i></span>
                                <input type="text" id="nombre" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="Ej: Ernesto Tejada" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Teléfono (WhatsApp)</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 border-end-0 bg-light text-success rounded-start-3"><i class="bi bi-whatsapp"></i></span>
                                <input type="text" id="telefono" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="77778888" maxlength="8" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 ps-0 shadow-none bg-light" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">Dirección de Envío</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 border-end-0 bg-light text-muted rounded-start-3 align-items-start pt-2"><i class="bi bi-geo-alt"></i></span>
                                <textarea id="direccion" class="form-control border-start-0 ps-0 shadow-none bg-light" rows="2" placeholder="Residencial, Polígono, Casa #, Municipio..."></textarea>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 mt-4 rounded-pill fw-bold shadow-sm">
                        REGISTRARME <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                    <hr class="text-muted opacity-25 my-4">

                    <div class="text-center">
                        <p class="text-secondary small mb-0">¿Ya tienes una cuenta? <a href="index.html" class="text-primary fw-bold text-decoration-none">Inicia Sesión</a></p>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Scripts (Lógica intacta) -->
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
