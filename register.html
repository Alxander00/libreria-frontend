<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta | MI TIENDA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-card { max-width: 500px; border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .input-neo { border: 1px solid #e9ecef; background-color: #f8f9fa; border-radius: 12px; padding: 12px 16px; }
        .input-neo:focus { background-color: #fff; border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1); }
        .btn-register { padding: 12px; border-radius: 12px; font-weight: 700; transition: all 0.3s; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 d-inline-block p-3 rounded-circle mb-3">
                            <i class="bi bi-person-plus-fill text-primary fs-1"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Crear una Cuenta</h2>
                        <p class="text-muted">Únete a nuestra comunidad para realizar tus compras.</p>
                    </div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted uppercase">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                                    <input type="text" id="nombre" class="form-control input-neo" placeholder="Ej: Ernesto Tejada" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted uppercase">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" class="form-control input-neo" placeholder="correo@ejemplo.com" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted uppercase">Teléfono (WhatsApp)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-whatsapp"></i></span>
                                    <input type="text" id="telefono" class="form-control input-neo" placeholder="77778888" maxlength="8" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted uppercase">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" class="form-control input-neo" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted uppercase">Dirección de Envío</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt"></i></span>
                                    <textarea id="direccion" class="form-control input-neo" rows="2" placeholder="Residencial, Polígono, Casa #, Municipio..."></textarea>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4 btn-register shadow-sm">
                            REGISTRARME <i class="bi bi-arrow-right ms-2"></i>
                        </button>

                        <div class="text-center mt-4">
                            <p class="text-muted small">¿Ya tienes una cuenta? <a href="index.html" class="text-primary fw-bold text-decoration-none">Inicia Sesión</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
