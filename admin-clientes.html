<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes | Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
</head>
<body class="bg-light">

<aside class="sidebar shadow-sm">
    <div class="brand-box mb-4 text-center border-bottom pb-3">
        <h4 class="fw-bold m-0 text-dark"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
        <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
    </div>
    <nav>
        <a href="admin-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="admin-productos.html" class="nav-link-custom"><i class="bi bi-box-seam me-2"></i> Inventario</a>
        <a href="admin-pedidos.html" class="nav-link-custom d-flex align-items-center justify-content-between">
            <div><i class="bi bi-truck me-2"></i> Pedidos</div>
            <span class="badge bg-danger rounded-pill badge-pedidos-nav d-none shadow-sm" style="font-size: 0.75rem;">0</span>
        </a>
        <a href="admin-categorias.html" class="nav-link-custom"><i class="bi bi-tags me-2"></i> Categorías</a>
        <a href="admin-clientes.html" class="nav-link-custom active shadow-sm"><i class="bi bi-people me-2"></i> Clientes</a>
        <a href="admin-descuentos.html" class="nav-link-custom"><i class="bi bi-percent me-2"></i> Descuentos</a>
        
        <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
            <a href="productos.html" class="nav-link-custom"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark"><i class="bi bi-people-fill text-primary me-2"></i>Directorio de Clientes</h2>
            <p class="text-muted mt-1 mb-0">Gestiona y analiza la actividad de tus usuarios registrados.</p>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card card-neo p-3 border-start border-primary border-4">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3">
                        <i class="bi bi-people text-primary fs-4"></i>
                    </div>
                    <div>
                        <small class="text-muted fw-bold d-block">TOTAL CLIENTES</small>
                        <h4 class="fw-bold m-0" id="totalClientes">0</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white py-4 px-4 border-0">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                        <span class="input-group-text bg-white border-0 ps-3"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="buscadorClientes" class="form-control border-0 bg-white" placeholder="Buscar en toda la base de datos..." onkeyup="buscarClientes()">
                    </div>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light text-muted small">
                    <tr>
                        <th class="px-4 py-3">CLIENTE</th>
                        <th class="py-3">CONTACTO</th>
                        <th class="py-3">ESTADO</th>
                        <th class="py-3 text-center">PEDIDOS</th>
                    </tr>
                </thead>
                <tbody id="tablaClientesBody"></tbody>
            </table>
        </div>
        
        <div id="paginationContainer" class="p-3 border-top bg-white"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script> <script src="js/admin-clientes.js"></script>
</body>
</html>
