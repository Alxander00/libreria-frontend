<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <admin-sidebar current="clientes"></admin-sidebar>

<main class="main-content">
    
    <!-- Banner Mágico -->
    <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
        <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
        <i class="bi bi-people position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
        
        <div class="position-relative z-1">
            <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-person-lines-fill me-1"></i> COMUNIDAD</span>
            </div>
            <h3 class="fw-bolder m-0 display-6">Directorio de Clientes</h3>
            <p class="text-white-50 small m-0 mt-1">Gestiona y analiza la actividad de tus usuarios registrados.</p>
        </div>
    </div>

    <!-- Panel de Búsqueda y Total -->
    <div class="card card-neo border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="row align-items-center g-3">
            <div class="col-md-4 border-end border-opacity-25">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3 text-primary border border-primary border-opacity-25">
                        <i class="bi bi-people-fill fs-4"></i>
                    </div>
                    <div>
                        <small class="text-muted fw-bold d-block text-uppercase" style="letter-spacing: 1px;">Total Registrados</small>
                        <h3 class="fw-bolder text-dark m-0" id="totalClientes">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="input-group bg-light rounded-pill overflow-hidden border p-1" style="transition: all 0.3s;" onfocusin="this.style.borderColor='#0d6efd'; this.style.boxShadow='0 0 0 4px rgba(13, 110, 253, 0.15)'" onfocusout="this.style.borderColor='var(--bs-border-color)'; this.style.boxShadow='none'">
                    <span class="input-group-text bg-transparent border-0 text-primary ps-3"><i class="bi bi-search"></i></span>
                    <input type="text" id="buscadorClientes" class="form-control bg-transparent border-0 shadow-none fw-bold text-dark" placeholder="Buscar cliente por nombre o correo..." onkeyup="buscarClientes()">
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="card card-neo border-0 shadow-sm rounded-4 overflow-hidden mb-5">
        <div class="table-responsive">
            <table class="table align-middle m-0 border-0">
                <thead class="bg-light text-muted small text-uppercase" style="letter-spacing: 1px;">
                    <tr>
                        <th class="ps-4 border-0 py-3 rounded-start-4">Cliente</th>
                        <th class="border-0 py-3">Contacto</th>
                        <th class="border-0 py-3">Estado</th>
                        <th class="pe-4 border-0 py-3 text-center rounded-end-4">Actividad</th>
                    </tr>
                </thead>
                <tbody id="tablaClientesBody" class="border-top-0"></tbody>
            </table>
        </div>
        <!-- Paginación -->
        <div id="paginationContainer" class="bg-white"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-clientes.js"></script>
</body>
</html>
