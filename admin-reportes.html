<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Exportar Ventas</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    <!-- SIDEBAR (copiar el mismo que en admin-historial-cortes) -->
     <admin-sidebar current="reportes"></admin-sidebar>

    <main class="main-content">
        <h2 class="fw-bold"><i class="bi bi-file-earmark-excel text-success me-2"></i>Exportar Ventas</h2>
        <p class="text-muted">Genera un archivo Excel con las ventas realizadas en un período.</p>

        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Desde</label>
                    <input type="datetime-local" id="desde" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Hasta</label>
                    <input type="datetime-local" id="hasta" class="form-control">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-success w-100 fw-bold shadow-sm py-2" onclick="exportarExcel()">
                        <i class="bi bi-download me-2"></i> Descargar Excel
                    </button>
                </div>
            </div>
            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i> Si no seleccionas fechas, se exportarán <strong>todas las ventas</strong> registradas (solo pedidos pagados y entregados).
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-reportes.js"></script>
</body>
</html>
