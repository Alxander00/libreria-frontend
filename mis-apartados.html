<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Apartados</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- NAVBAR (igual que en mis-listas.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4" href="productos.html">
                <i class="bi bi-bag-check-fill text-primary"></i> MI TIENDA
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContenido">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="mis-listas.html">Mis Listas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mis-apartados.html"><i class="bi bi-lock me-1"></i> Mis Apartados</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="carrito.html" class="btn btn-outline-light position-relative border-0 shadow-none">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-primary btn-sm dropdown-toggle shadow-none" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> Cuenta
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a class="dropdown-item" href="mis-pedidos.html">Mis Compras</a></li>
                            <li><a class="dropdown-item" href="mis-listas.html">Mis Listas</a></li>
                            <li><a class="dropdown-item" href="mis-apartados.html">Mis Apartados</a></li>
                            <li><a class="dropdown-item" href="perfil.html">Mi Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger fw-bold" id="btnSalir">Salir</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="fw-bold"><i class="bi bi-lock text-primary me-2"></i>Mis Apartados</h2>
        <p class="text-muted">Productos que has apartado con un abono inicial.</p>

        <div id="apartadosContainer" class="row g-4">
            <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>

    <!-- MODAL PARA ABONAR -->
    <div class="modal fade" id="modalAbonar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header bg-success text-white border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-cash-stack me-2"></i>Hacer Abono</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p>Producto: <strong id="modalAbonarProducto"></strong></p>
                    <p>Saldo restante: <strong class="text-primary" id="modalAbonarSaldo">$0.00</strong></p>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Monto a abonar ($)</label>
                        <input type="number" id="inputMontoAbono" class="form-control" step="0.01" min="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Método de Pago</label>
                        <select id="metodoAbono" class="form-select">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                        </select>
                    </div>
                    <button class="btn btn-success w-100 fw-bold rounded-pill py-2" onclick="procesarAbono()">
                        <i class="bi bi-check2-circle me-2"></i> Registrar Abono
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mis-apartados.js"></script>
</body>
</html>
