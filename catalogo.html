<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | MI TIENDA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/productos.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4" href="productos.html">
                <i class="bi bi-bag-check-fill text-primary"></i> MI TIENDA
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContenido">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item d-none" id="navMisPedidos"><a class="nav-link" href="mis-pedidos.html"><i class="bi bi-box-seam me-1"></i> Mis Pedidos</a></li>
                </ul>

                <form class="d-flex me-4 my-2 my-lg-0" id="searchForm" onsubmit="event.preventDefault(); aplicarFiltros();">
                    <div class="input-group">
                        <input class="form-control border-0 bg-light shadow-none" type="search" id="searchInput" placeholder="¿Qué estás buscando?">
                        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                    </div>
                </form>
                
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="carrito.html" class="btn btn-outline-light position-relative border-0 shadow-none">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
                    </a>

                    <div class="dropdown">
                        <button class="btn btn-primary btn-sm dropdown-toggle shadow-none" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> Cuenta
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li id="itemAdmin" class="d-none"><a class="dropdown-item fw-bold text-primary" href="admin-dashboard.html"><i class="bi bi-shield-lock me-2"></i> Administrar</a></li>
                            <li><a class="dropdown-item" href="mis-pedidos.html"><i class="bi bi-box-seam me-2"></i> Mis Compras</a></li>
                            <li><a class="dropdown-item" href="perfil.html"><i class="bi bi-person-lines-fill"></i> Mi Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger fw-bold" id="btnSalir"><i class="bi bi-box-arrow-right me-2"></i> Salir</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section id="catalogo-completo" class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4 text-dark"><i class="bi bi-collection me-2"></i>Catálogo de Productos</h2>
            
            <div class="row g-4">
                <div class="col-lg-3">
                    <div class="bg-white p-4 rounded-4 shadow-sm sticky-top" style="top: 100px;">
                        <h5 class="fw-bold mb-4 border-bottom pb-2"><i class="bi bi-funnel text-primary me-2"></i> Filtros</h5>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Categoría</label>
                            <select id="categoriaFiltro" class="form-select bg-light border-0 shadow-none">
                                <option value="">Todas las categorías</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Precio Mínimo ($)</label>
                            <input type="number" id="precioMinFiltro" class="form-control bg-light border-0 shadow-none" placeholder="0">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Precio Máximo ($)</label>
                            <input type="number" id="precioMaxFiltro" class="form-control bg-light border-0 shadow-none" placeholder="Sin límite">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Ordenar por</label>
                            <select id="ordenFiltro" class="form-select bg-light border-0 shadow-none">
                                <option value="">Relevancia</option>
                                <option value="menor">Precio: Menor a Mayor</option>
                                <option value="mayor">Precio: Mayor a Menor</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="btnAplicarFiltros" class="btn btn-primary fw-bold">Aplicar Filtros</button>
                            <button id="btnLimpiarFiltros" class="btn btn-outline-secondary fw-bold">Limpiar</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
                        <span id="contadorResultados" class="text-muted fw-bold">Cargando catálogo...</span>
                    </div>
                    
                    <div class="row g-4" id="catalogoContainer"></div>
                    
                    <div id="paginationContainer" class="mt-5 d-flex justify-content-center"></div>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="modalDetalleProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3 shadow-none" data-bs-dismiss="modal" style="z-index: 100;"></button>
                <div class="modal-body p-0">
                    <div class="row g-0">
                        <div class="col-lg-7 bg-light border-end" style="min-height: 400px;">
                            <div id="carouselProducto" class="carousel slide w-100 h-100" data-bs-ride="carousel">
                                <div class="carousel-indicators" id="carouselIndicators"></div>
                                <div class="carousel-inner h-100" id="carouselContent"></div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselProducto" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselProducto" data-bs-slide="next">
                                    <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-5 p-4 p-md-5 d-flex flex-column">
                            <div class="mb-4">
                                <span id="modalCategoria" class="badge bg-primary bg-opacity-10 text-primary mb-2 px-3 py-2 rounded-pill">Categoría</span>
                                <h2 id="modalNombre" class="fw-bold text-dark mb-2">Nombre</h2>
                                <h3 id="modalPrecio" class="fw-bold text-primary mb-3">$0.00</h3>
                                <p id="modalDescripcion" class="text-secondary"></p>
                            </div>

                            <div class="d-flex gap-3 mt-3 mb-4 bg-white p-3 rounded-3 border shadow-sm">
                                <div class="d-flex align-items-center gap-3 text-success">
                                    <i class="bi bi-shop fs-3"></i>
                                    <div class="lh-sm">
                                        <span class="d-block fw-bold small">Retiro gratis</span>
                                        <span class="text-muted" style="font-size: 0.75rem;">En nuestra tienda</span>
                                    </div>
                                </div>
                                <div class="vr text-secondary opacity-25"></div>
                                <div class="d-flex align-items-center gap-3 text-primary">
                                    <i class="bi bi-truck fs-3"></i>
                                    <div class="lh-sm">
                                        <span class="d-block fw-bold small">Envíos seguros</span>
                                        <span class="text-muted" style="font-size: 0.75rem;">A todo El Salvador</span>
                                    </div>
                                </div>
                            </div>

                            <div id="modalColoresContainer" class="mb-3">
                            </div>

                            <div class="mt-auto pt-4 border-top">
                                <div class="row g-3">
                                    <div class="col-4">
                                        <div class="input-group border rounded-3 overflow-hidden">
                                            <button class="btn btn-white border-0 text-primary" type="button" id="btnRestarModal"><i class="bi bi-dash"></i></button>
                                            <input type="number" id="modalCantidad" class="form-control border-0 text-center fw-bold bg-white" value="1" readonly>
                                            <button class="btn btn-white border-0 text-primary" type="button" id="btnSumarModal"><i class="bi bi-plus"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-8">
                                        <button id="modalBtnComprar" class="btn btn-primary w-100 fw-bold h-100 shadow-sm">SELECCIONA UN COLOR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
