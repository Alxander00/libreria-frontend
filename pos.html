<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta (POS) | MI LIBRERÍA</title>
    
    <!-- Librerías Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Estilos Globales y Específicos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pos.css">
</head>
<body>

    <!-- Elementos Decorativos Mágicos de Fondo -->
    <i class="bi bi-stars position-absolute text-primary opacity-25 flotante-1" style="font-size: 5rem; top: 10%; left: 5%;"></i>
    <i class="bi bi-shop position-absolute text-info opacity-20 flotante-2" style="font-size: 8rem; bottom: 5%; left: 15%;"></i>

    <!-- CONTENIDO PRINCIPAL (PRODUCTOS) -->
    <div class="pos-main">
        
        <div class="d-flex justify-content-between align-items-center mb-4 position-relative z-1">
            <h3 class="fw-bolder m-0 text-dark display-6"><i class="bi bi-cash-stack text-success me-2"></i>Caja Rápida</h3>
            <div class="d-flex gap-2 align-items-center">
                <span class="badge bg-white text-dark border px-3 py-2 rounded-pill shadow-sm d-flex align-items-center" id="cajeroNombre" style="font-size: 0.85rem;">
                    <i class="bi bi-person-circle me-1 text-primary"></i> Cajero: Admin
                </span>
                <!-- El botón de salir te regresa al nuevo Portal Administrativo -->
                <a href="admin-portal.html" class="btn btn-outline-danger btn-sm rounded-pill px-3 shadow-sm fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Salir al Portal
                </a>
            </div>
        </div>

        <!-- Buscador rápido Mágico -->
        <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden border border-2 bg-white search-container position-relative z-1">
            <span class="input-group-text bg-white border-0 ps-4 text-primary"><i class="bi bi-search fs-5"></i></span>
            <input type="text" id="searchInputPos" class="form-control border-0 py-3 search-pos" placeholder="Buscar producto por nombre..." onkeyup="cargarProductosPos()">
            <button class="btn btn-primary px-4 fw-bold" onclick="cargarProductosPos()">Buscar</button>
        </div>

        <!-- Grid de productos -->
        <div id="productosGrid" class="product-grid-pos">
            <div class="text-center py-5 w-100 position-absolute">
                <div class="spinner-border text-primary"></div>
                <p class="text-muted mt-2">Cargando magia...</p>
            </div>
        </div>
    </div>

    <!-- SIDEBAR DEL CARRITO (FIJO A LA DERECHA) -->
    <div class="pos-sidebar p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <h4 class="fw-bolder m-0 text-dark"><i class="bi bi-cart3 text-primary me-2"></i>Venta Actual</h4>
            <span class="badge bg-primary rounded-pill fs-6 px-3 shadow-sm" id="contadorItems">0</span>
        </div>

        <!-- Lista de items -->
        <div id="carritoPosItems" class="flex-grow-1 overflow-auto pe-2" style="max-height: 55vh;">
            <div class="text-muted text-center py-5">
                <i class="bi bi-basket text-secondary opacity-25" style="font-size: 4rem;"></i>
                <p class="mt-2">Agrega productos haciendo clic en ellos</p>
            </div>
        </div>

        <!-- Resumen y pago -->
        <div class="border-top pt-4 mt-auto">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold text-secondary text-uppercase" style="letter-spacing: 1px;">Total a Cobrar</span>
                <span class="cart-total" id="totalPos">$0.00</span>
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-7">
                    <label class="form-label small fw-bold text-muted mb-1" style="font-size: 0.75rem;">Método de Pago</label>
                    <select id="metodoPagoPos" class="form-select form-select-sm rounded-3 border bg-light text-dark">
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TARJETA">💳 Tarjeta</option>
                        <option value="TRANSFERENCIA">🏦 Transferencia</option>
                    </select>
                </div>
                <div class="col-5">
                    <label class="form-label small fw-bold text-muted mb-1" style="font-size: 0.75rem;">Recibido</label>
                    <input type="number" id="montoRecibido" class="form-control form-control-sm rounded-3 border bg-light text-dark" placeholder="$ 0.00" step="0.01" min="0" oninput="if(this.value < 0) this.value = Math.abs(this.value)">
                </div>
            </div>

            <button class="btn btn-success w-100 btn-pagar fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="procesarVentaPos()">
                <i class="bi bi-check2-circle fs-5"></i> COBRAR
            </button>
            <button class="btn btn-light text-danger w-100 mt-2 small fw-bold rounded-3 py-2" onclick="vaciarCarritoPos()">
                <i class="bi bi-trash me-1"></i> Vaciar Carrito
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
