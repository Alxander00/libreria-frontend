<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta | Librería Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Estilos específicos para el POS */
        body { background: #f3f4f6; font-family: 'Segoe UI', system-ui; overflow: hidden; height: 100vh; }
        .pos-sidebar {
            position: fixed; right: 0; top: 0; width: 380px; height: 100vh;
            background: #ffffff; box-shadow: -4px 0 15px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; z-index: 1050;
        }
        .pos-main { margin-right: 380px; height: 100vh; overflow-y: auto; padding: 20px; }
        .product-grid-pos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
        }
        .product-card-pos {
            background: white; border-radius: 12px; padding: 10px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s; text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .product-card-pos:hover { border-color: #0d6efd; transform: scale(1.02); }
        .product-card-pos img { width: 100%; height: 100px; object-fit: contain; }
        .cart-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .cart-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
        .cart-total { font-size: 1.8rem; font-weight: 800; color: #0d6efd; }
        .btn-pagar { height: 60px; font-size: 1.2rem; border-radius: 16px; }
        .badge-stock { font-size: 0.6rem; }
        .search-pos:focus { box-shadow: 0 0 0 3px rgba(13,110,253,0.25); border-color: #0d6efd; }
    </style>
</head>
<body>

    <!-- CONTENIDO PRINCIPAL (PRODUCTOS) -->
    <div class="pos-main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0"><i class="bi bi-cash-stack text-primary me-2"></i>Caja Registradora</h3>
            <div class="d-flex gap-2">
                <a href="admin-dashboard.html" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Volver</a>
                <span class="badge bg-secondary d-flex align-items-center px-3" id="cajeroNombre">Cajero: Admin</span>
            </div>
        </div>

        <!-- Buscador rápido -->
        <div class="input-group mb-4 shadow-sm rounded-4 overflow-hidden">
            <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInputPos" class="form-control border-0 py-3 search-pos" placeholder="Buscar producto por nombre..." onkeyup="cargarProductosPos()">
            <button class="btn btn-primary rounded-0" onclick="cargarProductosPos()"><i class="bi bi-arrow-right"></i></button>
        </div>

        <!-- Grid de productos -->
        <div id="productosGrid" class="product-grid-pos">
            <div class="text-center py-5">Cargando productos...</div>
        </div>
    </div>

    <!-- SIDEBAR DEL CARRITO (FIJO A LA DERECHA) -->
    <div class="pos-sidebar p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <h5 class="fw-bold m-0"><i class="bi bi-cart3 text-primary me-2"></i>Venta Actual</h5>
            <span class="badge bg-primary rounded-pill" id="contadorItems">0</span>
        </div>

        <!-- Lista de items -->
        <div id="carritoPosItems" class="flex-grow-1 overflow-auto" style="max-height: 55vh;">
            <div class="text-muted text-center py-4">Agrega productos desde la izquierda</div>
        </div>

        <!-- Resumen y pago -->
        <div class="border-top pt-3 mt-auto">
            <div class="d-flex justify-content-between mb-2">
                <span class="fw-bold">Total</span>
                <span class="cart-total" id="totalPos">$0.00</span>
            </div>
            
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <select id="metodoPagoPos" class="form-select form-select-sm rounded-pill border-0 bg-light">
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TARJETA">💳 Tarjeta</option>
                        <option value="TRANSFERENCIA">🏦 Transferencia</option>
                    </select>
                </div>
                <div class="col-6">
                    <input type="text" id="montoRecibido" class="form-control form-control-sm rounded-pill border-0 bg-light" placeholder="Monto recibido">
                </div>
            </div>

            <button class="btn btn-success w-100 btn-pagar fw-bold shadow-sm" onclick="procesarVentaPos()">
                <i class="bi bi-check2-circle me-2"></i> COBRAR Y FINALIZAR
            </button>
            <button class="btn btn-link text-danger w-100 mt-2 small" onclick="vaciarCarritoPos()">
                <i class="bi bi-trash me-1"></i> Vaciar carrito
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
