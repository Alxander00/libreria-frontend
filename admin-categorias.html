<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías | Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <admin-sidebar current="categorias"></admin-sidebar>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark"><i class="bi bi-tags-fill text-primary me-2"></i>Gestión de Categorías</h2>
            <p class="text-muted mt-1 mb-0">Organiza tus productos en grupos para que los clientes los encuentren fácil.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm border-0 rounded-4 sticky-top" style="top: 20px; z-index: 1;">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h5 class="mb-0 fw-bold d-flex align-items-center" id="formHeaderTitle">
                        <i class="bi bi-folder-plus text-success me-2 fs-4"></i> 
                        <span id="txtTituloForm">Crear Nueva Categoría</span>
                    </h5>
                    <p class="text-muted small mt-1">Llena los datos básicos.</p>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label for="nombreCategoria" class="form-label fw-bold text-dark">Nombre de la Categoría</label>
                        <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                            <span class="input-group-text bg-white border-0"><i class="bi bi-tag text-muted"></i></span>
                            <input type="text" id="nombreCategoria" class="form-control border-0 bg-white" placeholder="Ej: Laptops, Calzado...">
                        </div>
                    </div>
                    
                    <button id="btnGuardar" class="btn btn-primary w-100 fw-bold shadow-sm rounded-pill py-2" onclick="guardarCategoria()">
                        <i class="bi bi-plus-lg me-1"></i> Crear Categoría
                    </button>
                    <button id="btnCancelar" class="btn btn-outline-secondary w-100 fw-bold rounded-pill mt-2 py-2 d-none" onclick="cancelarEdicion()">
                        <i class="bi bi-x-lg me-1"></i> Cancelar Edición
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 px-4 border-0">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-ul text-secondary me-2"></i>Listado Actual</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light text-muted small">
                            <tr>
                                <th class="px-4 py-3">ID</th>
                                <th class="py-3">NOMBRE DE LA CATEGORÍA</th>
                                <th class="px-4 py-3 text-end">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCategoriasBody">
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                    <span class="ms-2">Cargando categorías...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script> 
<script src="js/admin-categorias.js"></script>
</body>
</html>
