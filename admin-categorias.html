<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <admin-sidebar current="categorias"></admin-sidebar>

<main class="main-content">
    
    <!-- Banner Mágico -->
    <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
        <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
        <i class="bi bi-diagram-3 position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
        
        <div class="position-relative z-1">
            <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-tags-fill me-1"></i> TAXONOMÍA</span>
            </div>
            <h3 class="fw-bolder m-0 display-6">Gestión de Categorías</h3>
            <p class="text-white-50 small m-0 mt-1">Organiza tus productos en grupos para que los clientes los encuentren fácilmente.</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Formulario -->
        <div class="col-md-5 col-lg-4 mb-3">
            <div class="card card-neo shadow-sm border-0 rounded-4 sticky-top border-top border-primary border-4" style="top: 20px; z-index: 1;">
                <div class="card-body p-4">
                    <h5 class="fw-bolder text-dark mb-1 d-flex align-items-center" id="formHeaderTitle">
                        <i class="bi bi-folder-plus text-primary bg-primary bg-opacity-10 p-2 rounded-3 me-2"></i> 
                        <span id="txtTituloForm">Crear Categoría</span>
                    </h5>
                    <p class="text-muted small mb-4">Ingresa el nombre del nuevo grupo.</p>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 1px;">Nombre de la Categoría</label>
                        <div class="input-group shadow-sm rounded-pill overflow-hidden border p-1" style="transition: all 0.3s;" onfocusin="this.style.borderColor='#0d6efd'; this.style.boxShadow='0 0 0 4px rgba(13, 110, 253, 0.15)'" onfocusout="this.style.borderColor='var(--bs-border-color)'; this.style.boxShadow='none'">
                            <span class="input-group-text bg-transparent border-0 text-primary ps-3"><i class="bi bi-tag-fill"></i></span>
                            <input type="text" id="nombreCategoria" class="form-control bg-transparent border-0 shadow-none fw-bold text-dark" placeholder="Ej: Laptops...">
                        </div>
                    </div>
                    
                    <button id="btnGuardar" class="btn btn-primary w-100 fw-bold shadow-sm rounded-pill py-2 d-flex justify-content-center align-items-center gap-2" onclick="guardarCategoria()">
                        <i class="bi bi-plus-circle-fill"></i> Guardar
                    </button>
                    <button id="btnCancelar" class="btn btn-light text-danger border w-100 fw-bold rounded-pill mt-2 py-2 d-none d-flex justify-content-center align-items-center gap-2" onclick="cancelarEdicion()">
                        <i class="bi bi-x-circle-fill"></i> Cancelar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="col-md-7 col-lg-8">
            <div class="card card-neo shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle m-0 border-0">
                        <thead class="bg-light text-muted small text-uppercase" style="letter-spacing: 1px;">
                            <tr>
                                <th class="ps-4 border-0 py-3 rounded-start-4">ID</th>
                                <th class="border-0 py-3">Nombre de la Categoría</th>
                                <th class="pe-4 border-0 py-3 text-end rounded-end-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCategoriasBody" class="border-top-0">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/admin-categorias.js"></script>
</body>
</html>
