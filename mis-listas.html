<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Listas Escolares | MI LIBRERÍA</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Tus Estilos Separados -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mis-listas.css">

    <!-- Orden Crucial de Scripts -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar Reutilizable -->
    <mi-navbar></mi-navbar>

    <!-- Contenido Principal -->
    <main class="container py-4 py-lg-5 flex-grow-1">
        
        <!-- Header / Banner Interno de la Sección -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center bg-white p-4 p-lg-4 rounded-4 shadow-sm mb-4 gap-3">
            <div>
                <div class="d-inline-flex align-items-center bg-warning bg-opacity-10 px-3 py-1 rounded-pill mb-2">
                    <span class="fw-bold text-warning small" style="letter-spacing: 0.5px;"><i class="bi bi-star-fill me-1"></i> GESTIÓN ESCOLAR</span>
                </div>
                <h2 class="fw-bolder text-dark m-0 display-6">
                    Mis Listas Escolares 🎒
                </h2>
                <p class="text-secondary small m-0 mt-1">
                    Crea, administra y envía tus listas de útiles para que las preparemos con anticipación.
                </p>
            </div>
            
            <div>
                <button class="btn btn-primary rounded-pill fw-bold px-4 py-2 shadow-sm d-flex align-items-center gap-2" onclick="mostrarModalCrearLista()">
                    <i class="bi bi-plus-circle-fill fs-5"></i> Nueva Lista
                </button>
            </div>
        </div>

        <!-- Línea decorativa -->
        <div class="d-flex align-items-center mb-4">
            <h5 class="fw-bold text-dark m-0">Listas Registradas</h5>
            <div class="flex-grow-1 ms-3" style="height: 2px; background: linear-gradient(90deg, #cce5ff 0%, transparent 100%);"></div>
        </div>

        <!-- Contenedor Dinámico de Listas -->
        <div id="misListasContainer" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Cargando tus listas...</p>
            </div>
        </div>
    </main>

    <!-- ========== MODAL CREAR LISTA ESCOLAR ========== -->
    <div class="modal fade" id="modalCrearLista" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
                <div class="modal-header bg-light border-bottom px-4 py-3">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-card-checklist text-primary me-2"></i>Nueva Lista Escolar</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold small text-muted">Grado o Nivel</label>
                            <input type="text" id="inputGrado" class="form-control bg-light border-0 shadow-none py-2" placeholder="Ej. Tercer Grado / Primer Año">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-muted">Año</label>
                            <input type="number" id="inputAnio" class="form-control bg-light border-0 shadow-none py-2" placeholder="2026">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Buscar Productos en el Catálogo</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchProductoLista" class="form-control bg-transparent border-0 shadow-none" placeholder="Escribe el nombre del libro o útil..." oninput="buscarProductosParaLista()">
                        </div>
                        <div id="resultadosBusqueda" class="border rounded-3 p-2 mt-2 bg-white shadow-sm" style="max-height: 180px; overflow-y: auto;">
                            <span class="text-muted small">Empieza a escribir para buscar productos...</span>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold small text-muted">Productos Seleccionados (<span id="contadorItemsSeleccionados" class="text-primary">0</span>)</label>
                        <div id="itemsSeleccionados" class="border rounded-3 p-3 bg-white shadow-sm" style="max-height: 200px; overflow-y: auto;">
                            <div class="text-muted text-center py-2">Aún no has agregado productos.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-top px-4 py-3">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="guardarLista()">Guardar y Enviar Lista</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navegación móvil y Footer -->
    <mi-bottom-nav current="cuenta"></mi-bottom-nav>
    <mi-footer></mi-footer>

    <!-- Scripts Finales -->
    <script src="js/mis-listas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
