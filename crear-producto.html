<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Producto | Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
    <style>
        /* Ajustes específicos para que se vea más 'Premium' */
        .form-label-custom { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; font-weight: 700; margin-bottom: 0.5rem; }
        .input-neo { border: 1px solid #e9ecef; background-color: #f8f9fa; border-radius: 12px; padding: 12px 16px; transition: all 0.3s ease; }
        .input-neo:focus { background-color: #fff; border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1); }
        .card-gallery { border: 2px dashed #dee2e6; border-radius: 16px; transition: all 0.3s ease; background: #fff; }
        .card-gallery:hover { border-color: #0d6efd; background: rgba(13, 110, 253, 0.02); }
        .sticky-card { position: sticky; top: 20px; }
    </style>
</head>
<body class="bg-light">

<aside class="sidebar shadow-sm">
    <div class="brand-box mb-4 text-center border-bottom pb-3">
        <h4 class="fw-bold m-0 text-dark"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
        <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
    </div>
    <nav>
        <a href="admin-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="admin-productos.html" class="nav-link-custom active shadow-sm"><i class="bi bi-box-seam me-2"></i> Inventario</a>
        <a href="admin-pedidos.html" class="nav-link-custom d-flex align-items-center justify-content-between">
            <div><i class="bi bi-truck me-2"></i> Pedidos</div>
            <span class="badge bg-danger rounded-pill badge-pedidos-nav d-none shadow-sm" style="font-size: 0.75rem;">0</span>
        </a>
        <a href="admin-categorias.html" class="nav-link-custom"><i class="bi bi-tags me-2"></i> Categorías</a>
        <a href="admin-clientes.html" class="nav-link-custom"><i class="bi bi-people me-2"></i> Clientes</a>
        <a href="admin-descuentos.html" class="nav-link-custom"><i class="bi bi-percent me-2"></i> Descuentos</a>
        
        <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
            <a href="productos.html" class="nav-link-custom"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="admin-productos.html" class="btn btn-link text-decoration-none p-0 mb-2 text-muted small fw-bold">
                <i class="bi bi-arrow-left"></i> VOLVER AL INVENTARIO
            </a>
            <h2 class="fw-bold m-0 text-dark" id="tituloPagina">🚀 Gestionar Producto</h2>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card card-neo p-4 mb-4">
                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-info-circle-fill text-primary me-2"></i> Información General</h5>
                
                <div class="mb-4">
                    <label for="nombre" class="form-label-custom">Nombre del Producto</label>
                    <input type="text" id="nombre" class="form-control input-neo" placeholder="Ej: Laptop">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="precio" class="form-label-custom">Precio de Venta ($)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">$</span>
                            <input type="number" id="precio" class="form-control input-neo" style="border-radius: 0 12px 12px 0;" placeholder="0.00" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="categoria" class="form-label-custom">Categoría</label>
                        <select id="categoria" class="form-select input-neo">
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>
                </div>

                <div class="mb-0">
                    <label for="descripcion" class="form-label-custom">Descripción Detallada</label>
                    <textarea id="descripcion" class="form-control input-neo" rows="5" placeholder="Escribe las especificaciones técnicas..."></textarea>
                </div>
            </div>

            <div class="card card-neo p-4">
                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-box-fill text-success me-2"></i> Control de Stock</h5>
                
                <div class="form-check form-switch mb-4 p-3 bg-light rounded-3 shadow-sm border-start border-4 border-success">
                    <input class="form-check-input ms-0 me-3" type="checkbox" id="checkVariaciones" onchange="toggleVariaciones()" style="width: 2.5rem; height: 1.25rem;">
                    <label class="form-check-label fw-bold text-success" for="checkVariaciones">Activar Variaciones (Colores, Tallas, Capacidades)</label>
                </div>

                <div id="seccionStockSimple">
                    <label for="stockSimple" class="form-label-custom">Cantidad Total (Stock Único)</label>
                    <input type="number" id="stockSimple" class="form-control input-neo w-50" value="1" min="0">
                </div>

                <div id="seccionVariaciones" class="d-none">
                    <div id="contenedor-variaciones" class="d-flex flex-column gap-3 mb-3"></div>
                    <button type="button" class="btn btn-outline-success btn-sm fw-bold rounded-pill px-4" onclick="agregarVariacionHTML()">
                        <i class="bi bi-plus-circle me-1"></i> Añadir Nueva Variación
                    </button>
                </div>
            </div>

            <div class="d-flex gap-3 mt-5">
                <button type="button" class="btn btn-light btn-lg rounded-pill px-5 fw-bold text-muted border" onclick="window.location.href='admin-productos.html'">
                    Cancelar
                </button>
                <button class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow flex-grow-1" onclick="crearProducto()" id="btnGuardar">
                    <i class="bi bi-save2-fill me-2"></i> Guardar Producto
                </button>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card card-neo p-4 sticky-card">
                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-images text-primary me-2"></i> Multimedia</h5>
                
                <div id="multi-preview" class="card-gallery d-flex flex-wrap gap-2 justify-content-center align-items-center mb-4 p-3" style="min-height: 250px;">
                    <div class="text-center text-muted opacity-50">
                        <i class="bi bi-cloud-upload display-4"></i>
                        <p class="small mt-2 px-4">Las fotos aparecerán aquí automáticamente.</p>
                    </div>
                </div>
                
                <label for="imagenes" class="btn btn-dark w-100 fw-bold rounded-pill py-3 shadow-sm mb-2">
                    <i class="bi bi-plus-lg me-2"></i> Seleccionar Fotos
                </label>
                <input type="file" id="imagenes" class="d-none" accept="image/*" multiple onchange="previewMultiplesImagenes(event)">
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script>
<script src="js/form-producto.js"></script> 
</body>
</html>
