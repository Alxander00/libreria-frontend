<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Producto | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
    <link rel="stylesheet" href="css/form-producto.css"> <!-- 🟢 CSS Separado -->

    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <!-- Sidebar Unificado -->
    <admin-sidebar current="productos"></admin-sidebar>

    <main class="main-content">
        
        <!-- Banner Superior Administrativo Mágico -->
        <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
            <i class="bi bi-magic position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
            
            <div class="position-relative z-1">
                <!-- 🟢 Botón de Regresar Corregido (Fondo blanco, texto azul) -->
                <a href="admin-productos.html" class="btn btn-sm bg-white text-primary fw-bold border-0 rounded-pill px-3 py-2 mb-3 shadow-sm d-inline-flex align-items-center">
                    <i class="bi bi-arrow-left-circle-fill me-2 fs-6"></i> Volver al Catálogo
                </a>
                
                <h3 class="fw-bolder m-0 display-6" id="tituloPagina">
                    Crear Nuevo Producto
                </h3>
                <p class="text-white-50 small m-0 mt-1">
                    Agrega los detalles técnicos, configura el stock y sube las imágenes promocionales.
                </p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <!-- Tarjeta Info General -->
                <div class="card card-neo border-0 shadow-sm p-4 mb-4 rounded-4 border-top border-primary border-4">
                    <h5 class="fw-bolder text-dark mb-4"><i class="bi bi-info-circle-fill text-primary bg-primary bg-opacity-10 p-2 rounded-3 me-2"></i> Información General</h5>
                    
                    <div class="mb-4">
                        <label for="nombre" class="form-label-custom">Nombre del Producto *</label>
                        <input type="text" id="nombre" class="form-control input-neo" placeholder="Ej: Set de Acuarelas Profesionales">
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="precio" class="form-label-custom">Precio de Venta ($) *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-secondary fw-bold" style="border-radius: 12px 0 0 12px;">$</span>
                                <input type="number" id="precio" class="form-control input-neo" style="border-radius: 0 12px 12px 0;" placeholder="0.00" step="0.01">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="categoria" class="form-label-custom">Categoría *</label>
                            <select id="categoria" class="form-select input-neo cursor-pointer">
                                <option value="">Cargando categorías...</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-0">
                        <label for="descripcion" class="form-label-custom">Descripción Detallada</label>
                        <textarea id="descripcion" class="form-control input-neo" rows="5" placeholder="Escribe las especificaciones técnicas o beneficios del producto..."></textarea>
                    </div>
                </div>

                <!-- Tarjeta Control de Stock -->
                <div class="card card-neo border-0 shadow-sm p-4 rounded-4 border-top border-success border-4">
                    <h5 class="fw-bolder text-dark mb-4"><i class="bi bi-box-fill text-success bg-success bg-opacity-10 p-2 rounded-3 me-2"></i> Control de Stock</h5>
                    
                    <div class="form-check form-switch mb-4 p-3 bg-light border border-success border-opacity-25 rounded-3 shadow-sm d-flex align-items-center">
                        <input class="form-check-input ms-0 me-3 cursor-pointer" type="checkbox" id="checkVariaciones" onchange="toggleVariaciones()" style="width: 2.5rem; height: 1.25rem;">
                        <label class="form-check-label fw-bold text-success cursor-pointer m-0 mt-1" for="checkVariaciones">Activar Variaciones (Colores, Tallas, Capacidades)</label>
                    </div>

                    <!-- Si es simple -->
                    <div id="seccionStockSimple" class="p-3 bg-light rounded-4 border">
                        <label for="stockSimple" class="form-label-custom">Cantidad Total en Bodega</label>
                        <div class="input-group w-50 shadow-sm rounded-pill overflow-hidden">
                            <span class="input-group-text bg-white border-0 text-secondary"><i class="bi bi-boxes"></i></span>
                            <input type="number" id="stockSimple" class="form-control border-0 bg-white fw-bold text-dark text-center" value="1" min="0">
                        </div>
                    </div>

                    <!-- Si tiene variaciones -->
                    <div id="seccionVariaciones" class="d-none">
                        <div id="contenedor-variaciones" class="d-flex flex-column gap-3 mb-3"></div>
                        <div class="text-center mt-4 border-top pt-4">
                            <!-- Este botón se reemplaza desde el JS -->
                        </div>
                    </div>
                </div>

                <!-- Botones Finales -->
                <div class="d-flex gap-3 mt-4">
                    <button type="button" class="btn btn-light btn-lg rounded-pill px-5 fw-bold text-danger border shadow-sm" onclick="window.location.href='admin-productos.html'">
                        <i class="bi bi-x-lg me-1"></i> Cancelar
                    </button>
                    <button class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm flex-grow-1" onclick="crearProducto()" id="btnGuardar">
                        <i class="bi bi-save2-fill me-2"></i> Guardar Producto
                    </button>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card card-neo border-0 shadow-sm p-4 sticky-card rounded-4 border-top border-info border-4">
                    <h5 class="fw-bolder text-dark mb-4"><i class="bi bi-images text-info bg-info bg-opacity-10 p-2 rounded-3 me-2"></i> Multimedia</h5>
                    
                    <div id="multi-preview" class="card-gallery d-flex flex-wrap gap-2 justify-content-center align-items-center mb-4 p-3 bg-light" style="min-height: 250px;">
                        <div class="text-center text-muted opacity-50">
                            <i class="bi bi-cloud-upload display-4 d-block mb-2"></i>
                            <p class="small m-0 px-2 fw-bold text-uppercase">Tus fotos aparecerán aquí</p>
                        </div>
                    </div>
                    
                    <label for="imagenes" class="btn btn-outline-info w-100 fw-bold rounded-pill py-3 shadow-sm cursor-pointer d-flex justify-content-center align-items-center gap-2">
                        <i class="bi bi-upload fs-5"></i> Cargar Imágenes
                    </label>
                    <input type="file" id="imagenes" class="d-none" accept="image/*" multiple onchange="previewMultiplesImagenes(event)">
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/form-producto.js"></script> 
</body>
</html>
