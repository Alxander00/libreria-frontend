<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras | Mi Tienda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/productos.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">

    <mi-navbar></mi-navbar>

    <div class="container mt-5 mb-5">
        <div class="row mb-3">
            <div class="col-12">
                <h2 class="fw-bold text-dark"><i class="bi bi-clock-history me-2 text-primary"></i> Mis Compras</h2>
            </div>
        </div>

        <ul class="nav nav-tabs mb-4 border-bottom" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active text-primary fw-bold border-0 border-bottom border-primary border-3 bg-transparent px-4 py-3" id="tab-pendientes" onclick="cambiarTabCliente('PENDIENTE', this)">
                    <i class="bi bi-hourglass-split me-1"></i> Pendientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-muted border-0 bg-transparent px-4 py-3" id="tab-proceso" onclick="cambiarTabCliente('PROCESO', this)">
                    <i class="bi bi-truck me-1"></i> En Proceso
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-muted border-0 bg-transparent px-4 py-3" id="tab-historial" onclick="cambiarTabCliente('HISTORIAL', this)">
                    <i class="bi bi-archive me-1"></i> Historial
                </button>
            </li>
        </ul>

        <div class="text-end mb-3" id="zonaLimpiezaHistorial" style="display: none;">
            <button class="btn btn-sm btn-outline-secondary rounded-pill border-0 bg-white shadow-sm" onclick="limpiarHistorialMasivo()">
                <i class="bi bi-trash-fill me-1"></i> Limpiar todo el historial
            </button>
        </div>

        <div class="row g-4" id="pedidosContainer">
            </div>
    </div>

    <mi-footer></mi-footer>

    <script src="js/api.js"></script>
    <script src="js/mis-pedidos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
