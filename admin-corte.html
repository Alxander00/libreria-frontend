<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corte de Caja | MI LIBRERÍA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">

    <script src="js/components.js"></script>
</head>
<body class="bg-light">
    
    <!-- Sidebar -->
    <admin-sidebar current="corte"></admin-sidebar>

    <main class="main-content">
        
        <!-- Banner Superior Administrativo Mágico -->
        <div class="admin-banner position-relative overflow-hidden p-4 rounded-4 mb-4 text-white shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <i class="bi bi-stars position-absolute text-white opacity-25 flotante-1" style="font-size: 4rem; top: 10%; right: 5%;"></i>
            <i class="bi bi-safe2 position-absolute text-white opacity-20 flotante-2" style="font-size: 6rem; bottom: -15px; right: 20%;"></i>
            
            <div class="position-relative z-1">
                <div class="d-inline-flex align-items-center bg-white bg-opacity-25 border border-white border-opacity-50 px-3 py-1 rounded-pill mb-2">
                    <span class="fw-bold text-white small" style="letter-spacing: 0.5px;"><i class="bi bi-calculator me-1"></i> FINANZAS</span>
                </div>
                <h3 class="fw-bolder m-0 display-6">
                    Corte de Caja
                </h3>
                <p class="text-white-50 small m-0 mt-1">
                    Verifica los ingresos desde el último corte. Cuenta tu efectivo físico y cierra el turno.
                </p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- PANEL DE SISTEMA (Izquierda) -->
            <div class="col-lg-8">
                <div class="card card-neo border-0 shadow-sm rounded-4 p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bolder text-dark m-0"><i class="bi bi-display text-primary me-2"></i>Registros del Sistema</h5>
                        <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="cargarPreview()"><i class="bi bi-arrow-clockwise"></i> Refrescar</button>
                    </div>
                    
                    <div id="previewContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                            <p class="text-muted mt-2">Calculando ingresos...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- PANEL DE CIERRE FÍSICO (Derecha) -->
            <div class="col-lg-4">
                <div class="card card-neo border-0 shadow-sm rounded-4 p-4 border-top border-primary border-4 h-100">
                    <h5 class="fw-bolder text-dark mb-4"><i class="bi bi-cash-coin text-success me-2"></i>Arqueo Físico</h5>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 1px;">Efectivo en gaveta</label>
                        <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-white border-0 text-success fw-bold fs-4">$</span>
                            <input type="number" id="inputEfectivoFisico" class="form-control border-0 fw-bolder text-dark fs-3" step="0.01" placeholder="0.00" oninput="if(this.value < 0) this.value = Math.abs(this.value)">
                        </div>
                        <small class="text-muted mt-2 d-block"><i class="bi bi-info-circle me-1"></i>Cuenta billetes y monedas.</small>
                    </div>

                    <div class="bg-light p-3 rounded-3 mb-4 border d-flex justify-content-between align-items-center" id="diferenciaPreview">
                        <span class="fw-bold text-secondary text-uppercase small" style="letter-spacing: 0.5px;">Diferencia:</span> 
                        <h4 class="m-0 fw-bolder text-secondary" id="diferenciaValor">$0.00</h4>
                    </div>

                    <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm d-flex justify-content-center align-items-center gap-2 mt-auto" onclick="cerrarCaja()" style="font-size: 1.1rem;">
                        <i class="bi bi-lock-fill"></i> CERRAR CAJA
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-corte.js"></script>
</body>
</html>
