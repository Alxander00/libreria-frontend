<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Corte de Caja</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin_dash.css">
</head>
<body class="bg-light">
    <!-- SIDEBAR -->
    <aside class="sidebar shadow-sm">
        <div class="brand-box mb-4 text-center border-bottom pb-3">
            <h4 class="fw-bold m-0 text-dark"><i class="bi bi-shield-lock-fill text-primary"></i> MI TIENDA</h4>
            <span class="badge bg-primary mt-2 rounded-pill px-3">Administración</span>
        </div>
        <nav>
            <a href="admin-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
            <a href="admin-productos.html" class="nav-link-custom"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a href="admin-pedidos.html" class="nav-link-custom"><i class="bi bi-truck me-2"></i> Pedidos</a>
            <a href="admin-categorias.html" class="nav-link-custom"><i class="bi bi-tags me-2"></i> Categorías</a>
            <a href="admin-clientes.html" class="nav-link-custom"><i class="bi bi-people me-2"></i> Clientes</a>
            <a href="admin-descuentos.html" class="nav-link-custom"><i class="bi bi-percent me-2"></i> Descuentos</a>
            <a href="admin-listas.html" class="nav-link-custom"><i class="bi bi-list-ul me-2"></i> Listas</a>
            <a href="admin-apartados.html" class="nav-link-custom"><i class="bi bi-lock me-2"></i> Apartados</a>
            <!-- NUEVO CORTE -->
            <a href="admin-corte.html" class="nav-link-custom active shadow-sm" style="background: #fd7e14; color: white;"><i class="bi bi-cash-stack me-2"></i> Corte de Caja</a>
            <a href="pos.html" class="nav-link-custom" style="background: #198754; color: white; border-radius: 8px; margin-top: 0.5rem;">
                <i class="bi bi-cash-coin me-2"></i> Punto de Venta
            </a>
            <div style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1rem;">
                <a href="productos.html" class="nav-link-custom"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
                <a href="#" id="logoutBtn" class="nav-link-custom text-danger" onclick="localStorage.clear(); window.location.href='index.html';">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
                </a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <h2 class="fw-bold"><i class="bi bi-cash-stack text-primary me-2"></i>Corte de Caja</h2>
        <p class="text-muted">Resumen de ventas desde el último corte. Cuenta el efectivo y cierra la caja.</p>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-4">Resumen de Ventas</h5>
                    <div id="previewContainer">
                        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-cash text-success me-2"></i>Cierre</h5>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Efectivo en Caja (contado físico)</label>
                        <input type="number" id="inputEfectivoFisico" class="form-control form-control-lg" step="0.01" placeholder="0.00">
                    </div>
                    <div class="alert alert-info" id="diferenciaPreview">
                        <span class="fw-bold">Diferencia:</span> <span id="diferenciaValor">$0.00</span>
                    </div>
                    <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm" onclick="cerrarCaja()">
                        <i class="bi bi-lock-fill me-2"></i> Cerrar Caja
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin-corte.js"></script>
</body>
</html>
